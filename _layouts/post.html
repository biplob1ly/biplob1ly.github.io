---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <span class="post-date">{{ page.date | date_to_string }}</span>
  {{ content }}
</div>

<style>
  pre.mermaid { background: none; border: 0; padding: 0; text-align: center; white-space: pre; overflow-x: auto; }
</style>

<script type="module">
  // Kramdown renders ```mermaid fences as <pre><code class="language-mermaid">.
  // Convert them to <pre class="mermaid"> and let Mermaid render them.
  const blocks = document.querySelectorAll('pre > code.language-mermaid');
  if (blocks.length) {
    blocks.forEach((code) => {
      const pre = document.createElement('pre');
      pre.className = 'mermaid';
      pre.textContent = code.textContent;
      code.parentElement.replaceWith(pre);
    });
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs');
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  }
</script>

<script>
  // Kramdown renders $$...$$ as <script type="math/tex">. Load MathJax only on pages that contain math.
  if (document.querySelector('script[type^="math/tex"]')) {
    window.MathJax = { tex2jax: { skipTags: ['pre', 'code'] }, TeX: { equationNumbers: { autoNumber: 'none' } } };
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML';
    s.async = true;
    document.head.appendChild(s);
  }
</script>

{% if site.related_posts.size >= 1 %}
<div class="related">
  <h2>Related posts</h2>
  <ul class="related-posts">
    {% for post in site.related_posts limit:3 %}
      <li>
        <h3>
          <a href="{{ site.baseurl }}{{ post.url }}">
            {{ post.title }}
            <small>{{ post.date | date_to_string }}</small>
          </a>
        </h3>
      </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
